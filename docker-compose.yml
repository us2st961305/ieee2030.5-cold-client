version: '3.8'

services:
  bms-client:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: ieee2030-5-bms-client
    restart: unless-stopped
    
    # 使用 host 網路模式
    network_mode: host
    
    # Environment variables
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      # IEEE 2030.5 Server Configuration
      - IEEE2030_5_SERVER_URL=${IEEE2030_5_SERVER_URL:-https://localhost:8443}
      # Modbus BMS Configuration
      - MODBUS_HOST=${MODBUS_HOST:-192.168.1.100}
      - MODBUS_PORT=${MODBUS_PORT:-502}
    
    # Mount configuration file
    volumes:
      - ./config:/app/config:ro
      # Mount certificates if needed
      - ./certs:/app/certs:ro
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
