[tool.poetry]
name = "ieee2030-5-bms-client"
version = "0.1.0"
description = "IEEE 2030.5 Client for Battery Management System integration via Modbus TCP/IP"
authors = ["Developer"]
license = "MIT"
readme = "README.md"
packages = [{ include = "bms_2030_5_client", from = "src" }]

[tool.poetry.dependencies]
python = "^3.9"
pymodbus = "^3.6.0"
defusedxml = "^0.7.1"
httpx = "^0.27.0"
aiohttp = "^3.9.0"
cryptography = "^42.0.0"
pyyaml = "^6.0.1"
dataclasses-json = "^0.6.4"
xsdata = {extras = ["lxml"], version = "^24.0"}
structlog = "^24.1.0"
flask = "^3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
black = "^24.0.0"
mypy = "^1.8.0"
ruff = "^0.2.0"

[tool.poetry.scripts]
bms-client = "bms_2030_5_client.main:main"
bms-web = "bms_2030_5_client.web.cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src/bms_2030_5_client"
